name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Keep the existing Ubuntu check name for PRs and main pushes.
        # macOS runs only on demand through Actions → CI → Run workflow.
        runner:
          - ${{ github.event_name == 'workflow_dispatch' && 'blacksmith-6vcpu-macos-15' || 'blacksmith-4vcpu-ubuntu-2404' }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache cargo registry, git, and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy
        run: cargo clippy --no-deps --all-targets -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo doc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
