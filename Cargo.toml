# Empty on purpose: this guards against Cargo silently treating figmog as a
# member of some *enclosing* workspace when this repo is checked out nested
# inside another Cargo project (e.g. a dev checkout under another crate's
# tree) — an empty [workspace] table makes this crate its own workspace
# root regardless of what's above it. Harmless as a standalone repo, where
# there's nothing above it to guard against; kept for that scenario anyway.
[workspace]

[package]
name = "figmog"
version = "0.0.3"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
fold = { git = "https://github.com/flowercomputers/bogkit", rev = "20f2ca50d5d06f51edfe8b8570c0fb48caf9eb81" }
# Already transitive through fold: name its snapshot type for independent readers.
fjall = { version = "=3.1.9", default-features = false }
# Already transitive through keyring: own a snapshot and its borrowing fold readers
# without unsafe code or leaking them. See docs/SPEC.md, asynchronous pulls.
self_cell = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
# Deep Figma trees exceed serde_json's default limit. Grow the stack during
# parsing/printing rather than merely disabling its recursion guard.
serde_stacker = "0.1"
ureq = { version = "2", features = ["json"] }
# Already transitive through ureq. Needed to retain its Mozilla trust roots
# when wrapping TLS socket I/O with our absolute request deadline.
webpki-roots = "0.26"
# Already transitive through ureq. Resolve relative redirects while
# recomputing each connection's share of the overall request budget.
url = "2"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
# Native credential storage avoids plaintext token files; rpassword reads
# interactive tokens without terminal echo or command-line arguments.
keyring = { version = "3.6.3", features = ["apple-native", "sync-secret-service", "crypto-rust", "vendored"] }
rpassword = "7.5"
# O_NOFOLLOW and O_NONBLOCK keep ignore-file opens from following a
# swapped symlink or blocking on a swapped FIFO (libc is already transitive).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
postcard = { version = "1", features = ["use-std"] }

[profile.dev]
opt-level = 3 # required for reasonable fold/anny perf
