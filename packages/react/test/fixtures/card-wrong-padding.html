<!doctype html>
<!-- Synthetic fixture: the sample card with deliberately wrong padding, not derived from any real file. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>figmog-shot sample card (wrong padding)</title>
    <link rel="stylesheet" href="card.css">
    <style>
      .card { padding: 8px 40px; }
    </style>
  </head>
  <body>
    <main>
      <article class="card" data-testid="card">
        <span class="card__badge">New</span>
        <h2 class="card__title">Quarterly summary</h2>
        <p class="card__body">Three tags, one button and a little motion to keep the capture honest.</p>
        <ul class="card__tags">
          <li class="card__tag">alpha</li>
          <li class="card__tag">beta</li>
          <li class="card__tag">gamma</li>
        </ul>
        <input class="card__input" value="caret" autofocus>
        <button class="card__button" type="button">Open</button>
      </article>
    </main>
  </body>
</html>
